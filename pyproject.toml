[project]
name = "reqlens"
version = "1.0.0"
description = "AI agents that review automotive requirements: extract requirements from PDF specifications and find conflicts and vague wording."
readme = "README.md"
authors = [
    { name = "Berke Aksakal", email = "141648712+BUAksakal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.18",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-llms-google-genai>=0.11.3",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "typer>=0.27.3",
]

[project.scripts]
reqlens = "reqlens.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]
