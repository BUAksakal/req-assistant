[project]
name = "req-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Berke Aksakal", email = "141648712+BUAksakal@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "typer>=0.27.3",
]

[project.scripts]
req = "req_assistant.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]
