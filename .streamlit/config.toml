[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#111111"
linkColor = "#111111"
borderColor = "#E5E5E5"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
font = "sans serif"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#FAFAFA"
chartCategoricalColors = ["#111111", "#A3A3A3"]
codeTextColor = "#111111"
codeBackgroundColor = "#F0F0F0"

[theme.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0F0F0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
