<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="400" viewBox="0 0 1250 400" role="img" aria-label="ReqLens workflow: a PDF is read, requirements are extracted, checked for vague wording and conflicts by a LlamaIndex agent, reviewed by an engineer and stored">
  <style>
    .t { font: 600 15px Helvetica, Arial, sans-serif; fill: #111111; }
    .s { font: 12px Helvetica, Arial, sans-serif; fill: #737373; }
    .l { font: 600 11px Helvetica, Arial, sans-serif; fill: #737373; letter-spacing: 0.06em; }
    .m { font: 12px Menlo, Consolas, monospace; fill: #525252; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.5; }
    .edge { fill: none; stroke: #111111; stroke-width: 1.5; }
    .flow { stroke-dasharray: 6 6; animation: dash 0.9s linear infinite; }
    .soft { stroke: #A3A3A3; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#A3A3A3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1248" height="398" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
  <text x="28" y="40" class="l">LANGGRAPH WORKFLOW</text>
  <rect x="140" y="30" width="1080" height="330" rx="12" fill="none" stroke="#E5E5E5" stroke-dasharray="4 4"/>

  <line x1="112" y1="210" x2="160" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="292" y1="210" x2="538" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <text x="404" y="200" class="s" text-anchor="middle">requirements found</text>
  <path d="M292 192 L330 192 L330 104 L352 104" class="edge soft flow" marker-end="url(#arrow-soft)"/>
  <text x="300" y="148" class="s">0 found</text>
  <path d="M488 104 L512 104 L512 192 L538 192" class="edge soft flow" marker-end="url(#arrow-soft)"/>
  <line x1="672" y1="210" x2="728" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="872" y1="210" x2="928" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="1062" y1="210" x2="1098" y2="210" class="edge flow" marker-end="url(#arrow)"/>

  <g>
    <path d="M30 172 L84 172 L104 192 L104 248 L30 248 Z" class="box"/>
    <path d="M84 172 L84 192 L104 192" fill="none" stroke="#111111" stroke-width="1.5"/>
    <line x1="42" y1="204" x2="88" y2="204" stroke="#A3A3A3" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="216" x2="80" y2="216" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="228" x2="86" y2="228" stroke="#A3A3A3" stroke-width="3" stroke-linecap="round"/>
    <text x="67" y="272" class="t" text-anchor="middle">PDF</text>
    <text x="67" y="290" class="s" text-anchor="middle">upload</text>
  </g>

  <g>
    <rect x="162" y="176" width="130" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.05;0.07;0.15;0.17;1"/>
    </rect>
    <text x="227" y="205" class="t" text-anchor="middle">Classic extract</text>
    <text x="227" y="224" class="s" text-anchor="middle">PyMuPDF + regex</text>
  </g>

  <g>
    <rect x="354" y="70" width="134" height="68" rx="8" class="box" stroke-dasharray="5 4"/>
    <text x="421" y="99" class="t" text-anchor="middle">LLM extract</text>
    <text x="421" y="118" class="s" text-anchor="middle">Gemini, typed output</text>
  </g>

  <g>
    <rect x="540" y="176" width="132" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.35;0.37;0.45;0.47;1"/>
    </rect>
    <text x="606" y="205" class="t" text-anchor="middle">Vague check</text>
    <text x="606" y="224" class="s" text-anchor="middle">word rules</text>
  </g>

  <rect x="714" y="150" width="172" height="202" rx="10" fill="#FAFAFA" stroke="#D4D4D4"/>
  <text x="800" y="168" class="l" text-anchor="middle">LLAMAINDEX AGENT</text>
  <g>
    <rect x="730" y="176" width="140" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.51;0.53;0.69;0.71;1"/>
    </rect>
    <text x="800" y="205" class="t" text-anchor="middle">Conflict agent</text>
    <text x="800" y="224" class="s" text-anchor="middle">Gemini decides</text>
  </g>
  <line x1="780" y1="246" x2="780" y2="284" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="820" y1="284" x2="820" y2="246" class="edge flow" marker-end="url(#arrow)"/>
  <circle r="4" fill="#111111">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M780 248 L780 282 L820 282 L820 248 Z"/>
  </circle>
  <g>
    <path d="M748 292 L748 334 A52 9 0 0 0 852 334 L852 292" class="box"/>
    <ellipse cx="800" cy="292" rx="52" ry="9" class="box"/>
    <text x="800" y="315" class="s" text-anchor="middle">semantic index</text>
    <text x="800" y="330" class="s" text-anchor="middle">embeddings</text>
  </g>
  <text x="704" y="268" class="m" text-anchor="end">find_related()</text>

  <g>
    <rect x="930" y="176" width="132" height="68" rx="8" class="box" stroke-dasharray="5 4">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.75;0.77;0.89;0.91;1"/>
    </rect>
    <text x="996" y="205" class="t" text-anchor="middle">Engineer review</text>
    <text x="996" y="224" class="s" text-anchor="middle">approve / reject</text>
  </g>
  <text x="996" y="268" class="m" text-anchor="middle">✓  ✕</text>

  <g>
    <rect x="1100" y="176" width="112" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4" keyTimes="0;0.95;0.97;1"/>
    </rect>
    <text x="1156" y="205" class="t" text-anchor="middle">Report</text>
    <text x="1156" y="224" class="s" text-anchor="middle">SQLite history</text>
  </g>

  <circle r="7" fill="#111111">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0.088;0.088;0.456;0.456;0.640;0.640;0.835;0.835;1;1" keyTimes="0;0.06;0.16;0.36;0.46;0.52;0.70;0.76;0.90;0.96;1" calcMode="linear" path="M67 210 L1096 210"/>
  </circle>

  <text x="28" y="384" class="s">The dot follows one specification through the workflow. The agent loops over the index for every requirement it checks, and the workflow pauses until the engineer has decided.</text>
</svg>
