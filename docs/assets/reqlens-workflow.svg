<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="540" viewBox="0 0 1580 540" role="img" aria-label="ReqLens workflow: a PDF is read by the classic extractor, a LangGraph supervisor agent decides whether the LLM must extract instead, requirements are checked for vague wording and conflicts by a LlamaIndex agent, a supervisor verifies each conflict, an engineer reviews and the result is stored">
  <style>
    .t { font: 600 15px Helvetica, Arial, sans-serif; fill: #111111; }
    .s { font: 12px Helvetica, Arial, sans-serif; fill: #737373; }
    .l { font: 600 11px Helvetica, Arial, sans-serif; fill: #737373; letter-spacing: 0.06em; }
    .m { font: 12px Menlo, Consolas, monospace; fill: #525252; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.5; }
    .sup { fill: #111111; stroke: #111111; stroke-width: 1.5; }
    .ti { font: 600 15px Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .si { font: 12px Helvetica, Arial, sans-serif; fill: #D4D4D4; }
    .edge { fill: none; stroke: #111111; stroke-width: 1.5; }
    .flow { stroke-dasharray: 6 6; animation: dash 0.9s linear infinite; }
    .soft { stroke: #A3A3A3; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#A3A3A3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1578" height="538" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="128" y="30" width="1422" height="470" rx="12" fill="none" stroke="#525252" stroke-width="1.8" stroke-dasharray="8 6"/>
  <rect x="146" y="21" width="168" height="20" rx="4" fill="#111111"/>
  <text x="230" y="35" class="l" text-anchor="middle" style="fill:#FFFFFF">LANGGRAPH WORKFLOW</text>

  <line x1="112" y1="210" x2="148" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="280" y1="210" x2="318" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="460" y1="210" x2="678" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <text x="569" y="200" class="s" text-anchor="middle">accept</text>
  <path d="M460 192 L478 192 L478 104 L498 104" class="edge soft flow" marker-end="url(#arrow-soft)"/>
  <text x="486" y="150" class="s">use_llm</text>
  <path d="M640 104 L660 104 L660 192 L678 192" class="edge soft flow" marker-end="url(#arrow-soft)"/>
  <line x1="810" y1="210" x2="864" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="1006" y1="210" x2="1068" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="1200" y1="210" x2="1238" y2="210" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="1372" y1="210" x2="1410" y2="210" class="edge flow" marker-end="url(#arrow)"/>

  <g>
    <path d="M30 172 L84 172 L104 192 L104 248 L30 248 Z" class="box"/>
    <path d="M84 172 L84 192 L104 192" fill="none" stroke="#111111" stroke-width="1.5"/>
    <line x1="42" y1="204" x2="88" y2="204" stroke="#A3A3A3" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="216" x2="80" y2="216" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="228" x2="86" y2="228" stroke="#A3A3A3" stroke-width="3" stroke-linecap="round"/>
    <text x="67" y="272" class="t" text-anchor="middle">PDF</text>
    <text x="67" y="290" class="s" text-anchor="middle">upload</text>
  </g>

  <g>
    <rect x="150" y="176" width="130" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.05;0.06;0.12;0.13;1"/>
    </rect>
    <text x="215" y="205" class="t" text-anchor="middle">Classic extract</text>
    <text x="215" y="224" class="s" text-anchor="middle">PyMuPDF + regex</text>
  </g>

  <g>
    <rect x="320" y="176" width="140" height="68" rx="8" class="sup">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;5;5;1.5;1.5" keyTimes="0;0.16;0.17;0.24;0.25;1"/>
    </rect>
    <text x="390" y="205" class="ti" text-anchor="middle">Enough found?</text>
    <text x="390" y="224" class="si" text-anchor="middle">supervisor node</text>
  </g>

  <g>
    <rect x="500" y="70" width="140" height="68" rx="8" class="box" stroke-dasharray="5 4"/>
    <text x="570" y="99" class="t" text-anchor="middle">LLM extract</text>
    <text x="570" y="118" class="s" text-anchor="middle">Gemini, 8-page chunks</text>
  </g>

  <g>
    <rect x="680" y="176" width="130" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.32;0.33;0.40;0.41;1"/>
    </rect>
    <text x="745" y="205" class="t" text-anchor="middle">Vague check</text>
    <text x="745" y="224" class="s" text-anchor="middle">word rules</text>
  </g>

  <rect x="850" y="150" width="172" height="202" rx="10" fill="#FAFAFA" stroke="#525252" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="866" y="141" width="140" height="18" rx="4" fill="#FFFFFF" stroke="#525252" stroke-width="1.2"/>
  <text x="936" y="154" class="l" text-anchor="middle" style="fill:#111111">LLAMAINDEX AGENT</text>
  <g>
    <rect x="866" y="176" width="140" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.44;0.45;0.58;0.59;1"/>
    </rect>
    <text x="936" y="205" class="t" text-anchor="middle">Conflict agent</text>
    <text x="936" y="224" class="s" text-anchor="middle">Gemini decides</text>
  </g>
  <line x1="916" y1="246" x2="916" y2="284" class="edge flow" marker-end="url(#arrow)"/>
  <line x1="956" y1="284" x2="956" y2="246" class="edge flow" marker-end="url(#arrow)"/>
  <circle r="4" fill="#111111">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M916 248 L916 282 L956 282 L956 248 Z"/>
  </circle>
  <g>
    <path d="M884 292 L884 334 A52 9 0 0 0 988 334 L988 292" class="box"/>
    <ellipse cx="936" cy="292" rx="52" ry="9" class="box"/>
    <text x="936" y="315" class="s" text-anchor="middle">semantic index</text>
    <text x="936" y="330" class="s" text-anchor="middle">embeddings</text>
  </g>
  <text x="840" y="268" class="m" text-anchor="end">find_related()</text>

  <g>
    <rect x="1070" y="176" width="130" height="68" rx="8" class="sup">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;5;5;1.5;1.5" keyTimes="0;0.62;0.63;0.70;0.71;1"/>
    </rect>
    <text x="1135" y="205" class="ti" text-anchor="middle">Verify findings</text>
    <text x="1135" y="224" class="si" text-anchor="middle">supervisor node</text>
  </g>

  <g>
    <rect x="1240" y="176" width="132" height="68" rx="8" class="box" stroke-dasharray="5 4">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4;1.5;1.5" keyTimes="0;0.74;0.75;0.88;0.89;1"/>
    </rect>
    <text x="1306" y="205" class="t" text-anchor="middle">Engineer review</text>
    <text x="1306" y="224" class="s" text-anchor="middle">approve / reject</text>
  </g>
  <text x="1306" y="268" class="m" text-anchor="middle">✓  ✕</text>

  <g>
    <rect x="1412" y="176" width="112" height="68" rx="8" class="box">
      <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" values="1.5;1.5;4;4" keyTimes="0;0.92;0.93;1"/>
    </rect>
    <text x="1468" y="205" class="t" text-anchor="middle">Report</text>
    <text x="1468" y="224" class="s" text-anchor="middle">SQLite history</text>
  </g>

  <rect x="300" y="392" width="920" height="96" rx="10" fill="#FAFAFA" stroke="#525252" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="316" y="383" width="210" height="18" rx="4" fill="#FFFFFF" stroke="#525252" stroke-width="1.2"/>
  <text x="421" y="396" class="l" text-anchor="middle" style="fill:#111111">LANGGRAPH SUPERVISOR AGENT</text>
  <path d="M390 246 L390 438 L678 438" class="edge flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M1135 246 L1135 438 L842 438" class="edge flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <circle r="4" fill="#111111">
    <animateMotion dur="3s" repeatCount="indefinite" path="M390 250 L390 438 L674 438 L390 438 L390 250"/>
  </circle>
  <circle r="4" fill="#111111">
    <animateMotion dur="3s" repeatCount="indefinite" path="M1135 250 L1135 438 L846 438 L1135 438 L1135 250"/>
  </circle>
  <text x="400" y="320" class="m">unextracted 'shall'</text>
  <text x="1145" y="320" class="m">conflict claim</text>
  <text x="534" y="428" class="m" text-anchor="middle">accept / use_llm</text>
  <text x="988" y="428" class="m" text-anchor="middle">keep / drop</text>
  <g>
    <rect x="680" y="410" width="160" height="56" rx="8" class="sup"/>
    <text x="760" y="434" class="ti" text-anchor="middle">Supervisor agent</text>
    <text x="760" y="453" class="si" text-anchor="middle">Gemini decides</text>
  </g>
  <text x="760" y="481" class="s" text-anchor="middle">typed answer · cache · rule fallback</text>

  <circle r="7" fill="#111111" stroke="#FFFFFF" stroke-width="2">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0.110;0.110;0.241;0.241;0.506;0.506;0.648;0.648;0.796;0.796;0.924;0.924;1;1" keyTimes="0;0.05;0.12;0.16;0.24;0.32;0.40;0.44;0.58;0.62;0.70;0.74;0.88;0.92;1" calcMode="linear" path="M67 210 L1408 210"/>
  </circle>

  <text x="28" y="524" class="s">The dot follows one specification through the workflow. Both black nodes ask the same supervisor agent: should the LLM extract, and does each conflict hold up? The workflow pauses until the engineer has decided.</text>
</svg>
